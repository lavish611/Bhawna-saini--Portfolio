{% extends "admin/base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block admin_content %}
<form class="glass-card admin-form-card admin-form" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-row-2">
    <div class="field"><label>Full Name</label><input type="text" name="full_name" value="{{ profile.full_name }}" required></div>
    <div class="field"><label>Title</label><input type="text" name="title" value="{{ profile.title }}" placeholder="e.g. Full-Stack Developer"></div>
  </div>
  <div class="field"><label>Tagline</label><input type="text" name="tagline" value="{{ profile.tagline }}" placeholder="Short line shown under your name"></div>
  <div class="field"><label>Bio</label><textarea name="bio">{{ profile.bio }}</textarea></div>
  <div class="form-row-2">
    <div class="field"><label>Email</label><input type="email" name="email" value="{{ profile.email }}"></div>
    <div class="field"><label>Phone</label><input type="text" name="phone" value="{{ profile.phone }}"></div>
  </div>
  <div class="form-row-2">
    <div class="field"><label>Location</label><input type="text" name="location" value="{{ profile.location }}"></div>
    <div class="field"><label>Status / Experience</label><input type="text" name="years_experience" value="{{ profile.years_experience }}" placeholder="e.g. Final Year Student"></div>
  </div>
  <div class="form-row-2">
    <div class="field">
      <label>Profile Photo</label>
      <input type="file" name="profile_image" accept="image/*">
      {% if profile.profile_image %}<div class="current-file-preview"><img src="{{ url_for('static', filename=profile.profile_image) }}" alt="Current photo"></div>{% endif %}
    </div>
    <div class="field">
      <label>Resume (PDF)</label>
      <input type="file" name="resume_file" accept="application/pdf">
      {% if profile.resume_file %}<div class="current-file-preview"><i class="fa-solid fa-file-pdf"></i> Current resume uploaded</div>{% endif %}
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
  </div>
</form>
{% endblock %}
